[theme]
# Trava o sistema no modo escuro (Corrige os cards brancos na tela de admin)
base = "dark"

# Cor dos botões principais (Azul Corporativo)
primaryColor = "#1E40AF"

# Fundo geral da tela (Preto Profundo - substitui a tarja cinza)
backgroundColor = "#FF1493" #050810"(cinza escuro) 

# Fundo dos Cards e do Menu Lateral (Azul Acinzentado)
secondaryBackgroundColor = "#FFFF00" #1E293B"(cinza dos cards internos) 

# Cor do Texto
textColor = "#F8FAFC"

font = "sans serif"
